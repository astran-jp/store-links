<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <base target="_top">
    <title>アプリ一覧</title>

    <!-- Androidは従来どおり即座にmotitanへリダイレクト（iOS用ページを描画する前に離脱） -->
    <script>
        if (/android/i.test(navigator.userAgent)) {
            location.replace('https://play.google.com/store/apps/details?id=jp.astran.motitan_production');
        }
    </script>

    <style>
        :root {
            --bg:        #ffffff;
            --fg:        #1d1d1f;
            --fg-2:      #6e6e73;
            --hairline:  #d2d2d7;
            --pill-bg:   #e8e8ed;
            --pill-bg-h: #d8d8de;
            --accent:    #0071e3;
            --icon-edge: rgba(0,0,0,0.09);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg:        #000000;
                --fg:        #f5f5f7;
                --fg-2:      #86868b;
                --hairline:  #2a2a2c;
                --pill-bg:   #1c1c1e;
                --pill-bg-h: #2c2c2e;
                --accent:    #2997ff;
                --icon-edge: rgba(255,255,255,0.10);
            }
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                         "Helvetica Neue", "Hiragino Sans", "Yu Gothic", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .wrap {
            max-width: 692px; margin: 0 auto;
            padding: calc(28px + env(safe-area-inset-top)) 20px
                     calc(40px + env(safe-area-inset-bottom));
        }

        .section-title {
            font-size: 22px; font-weight: 700; letter-spacing: -0.01em;
            margin: 0 0 6px;
        }

        /* アプリ行 */
        .app-row {
            display: flex; align-items: center; gap: 14px;
            padding: 16px 0;
            border-bottom: 0.5px solid var(--hairline);
            text-decoration: none; color: inherit;
            opacity: 0; transform: translateY(8px);
            animation: rise .5s cubic-bezier(.22,.61,.36,1) forwards;
        }
        .app-list .app-row:last-child { border-bottom: none; }
        .app-row:nth-child(1) { animation-delay: .04s; }
        .app-row:nth-child(2) { animation-delay: .12s; }
        @keyframes rise { to { opacity: 1; transform: none; } }

        .icon {
            flex: 0 0 auto;
            width: 64px; height: 64px; border-radius: 15px;
            background-size: cover; background-position: center;
            box-shadow: inset 0 0 0 0.5px var(--icon-edge);
            display: grid; place-items: center;
            font-size: 26px; font-weight: 700; color: #fff;
        }
        /* 実アイコン取得前のフォールバック表示 */
        .icon--motitan { background-image: linear-gradient(145deg,#ff8a3d,#ff5e3a); }
        .icon--motispi { background-image: linear-gradient(145deg,#34c1ff,#0a84ff); }

        .meta { flex: 1 1 auto; min-width: 0; }
        .meta .name {
            font-size: 17px; font-weight: 600; line-height: 1.25;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .meta .cat { font-size: 15px; color: var(--fg-2); margin-top: 3px; }

        .get-btn {
            flex: 0 0 auto;
            min-width: 74px; text-align: center;
            font-size: 15px; font-weight: 700; letter-spacing: 0.01em;
            color: var(--accent); background: var(--pill-bg);
            border: none; border-radius: 16px;
            padding: 7px 18px; cursor: pointer;
            transition: background .15s ease, transform .1s ease;
            text-decoration: none;
        }
        .app-row:active .get-btn { background: var(--pill-bg-h); transform: scale(.96); }
        @media (hover:hover) { .get-btn:hover { background: var(--pill-bg-h); } }
    </style>
</head>
<body>
    <main class="wrap">
        <h2 class="section-title">アプリ一覧</h2>

        <div class="app-list">
            <!-- モチスピ -->
            <a class="app-row" href="https://apps.apple.com/jp/app/id6761979905">
                <span class="icon icon--motispi" data-appid="6761979905">話</span>
                <span class="meta">
                    <span class="name">AI英会話モチスピ</span>
                    <span class="cat">教育</span>
                </span>
                <span class="get-btn">入手</span>
            </a>

            <!-- モチタン -->
            <a class="app-row" href="https://apps.apple.com/jp/app/id6451048056">
                <span class="icon icon--motitan" data-appid="6451048056">単</span>
                <span class="meta">
                    <span class="name">英単語モチタン</span>
                    <span class="cat">教育</span>
                </span>
                <span class="get-btn">入手</span>
            </a>
        </div>
    </main>

    <!-- App Storeの実アイコンをiTunes公式APIから取得して反映（取得失敗時はフォールバックのまま） -->
    <script>
        window.__appIcons = function (data) {
            (data.results || []).forEach(function (r) {
                var el = document.querySelector('.icon[data-appid="' + r.trackId + '"]');
                if (!el || !r.artworkUrl100) return;
                var url = r.artworkUrl100.replace(/\/\d+x\d+bb\./, '/200x200bb.');
                var img = new Image();
                img.onload = function () {
                    el.style.backgroundImage = "url('" + url + "')";
                    el.textContent = '';
                };
                img.src = url;
            });
        };
        (function () {
            var s = document.createElement('script');
            s.src = 'https://itunes.apple.com/lookup?id=6451048056,6761979905&country=jp&callback=__appIcons';
            document.head.appendChild(s);
        })();
    </script>
</body>
</html>
